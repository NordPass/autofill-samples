<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ad</title>
    <style>
      body {
        font:
          12px system-ui,
          sans-serif;
        margin: 0;
        padding: 8px;
        background: #fff7e0;
      }
      .row {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .row span {
        padding: 2px 4px;
        background: #ffe6a8;
      }
    </style>
  </head>
  <body>
    <script>
      // Stands in for an ad / consent / captcha frame: busy markup plus a stray input,
      // the shape 7.12 still ran the classifier over.
      const host = location.hostname;
      const tags = Array.from(
        { length: 300 },
        (_, k) => `<span>${host.split('.')[0]} ${k}</span>`,
      ).join('');
      document.body.innerHTML = `<b>${host}</b><div class="row">${tags}</div><form><input type="email" name="newsletter" placeholder="Get offers"><button type="button">OK</button></form>`;
    </script>
  </body>
</html>
