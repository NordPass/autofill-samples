<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autofill Stress Page</title>
    <style>
      :root {
        --bg: #fff;
        --fg: #1d1f23;
        --muted: #6b7280;
        --panel: #111827;
        --panel-fg: #f9fafb;
        --ok: #22c55e;
        --bad: #ef4444;
        --card: #f3f4f6;
      }
      body {
        margin: 0;
        font:
          14px system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      #hud {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--panel);
        color: var(--panel-fg);
        padding: 10px 16px;
        display: grid;
        gap: 8px;
      }
      #top {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      #build {
        font:
          700 22px ui-monospace,
          monospace;
        padding: 4px 12px;
        border-radius: 6px;
        background: #374151;
        white-space: nowrap;
      }
      #links {
        margin-left: auto;
        display: flex;
        gap: 12px;
        white-space: nowrap;
      }
      #links a {
        color: #93c5fd;
      }
      #stats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 20px;
        font:
          600 15px ui-monospace,
          monospace;
      }
      #stats b {
        font-weight: 400;
        color: #9ca3af;
        margin-right: 6px;
      }
      #track {
        position: relative;
        height: 22px;
        background: #1f2937;
        border-radius: 4px;
        overflow: hidden;
      }
      #box {
        position: absolute;
        top: 2px;
        left: 0;
        width: 18px;
        height: 18px;
        border-radius: 3px;
        background: var(--ok);
        will-change: transform;
      }
      #controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        font-size: 13px;
      }
      #controls input {
        width: 56px;
      }
      main {
        padding: 16px;
        display: grid;
        gap: 16px;
      }
      .frames {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 8px;
      }
      .frames iframe {
        width: 100%;
        height: 190px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: #fff;
      }
      .frames iframe.ad {
        height: 120px;
        border-style: dashed;
      }
      .forms {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 8px;
      }
      .forms form {
        display: grid;
        gap: 6px;
        padding: 10px;
        background: var(--card);
        border-radius: 4px;
      }
      .forms input,
      .forms select,
      .forms button {
        font: inherit;
        padding: 6px;
      }
      .filler article {
        padding: 6px 0;
        border-bottom: 1px solid #e5e7eb;
        color: var(--muted);
      }
      h2 {
        margin: 8px 0 0;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="top">
        <div id="build"></div>
        <div id="stats">
          <span><b>fps</b><span id="fps">-</span></span>
          <span><b>dropped</b><span id="dropped">0</span></span>
          <span><b>long tasks</b><span id="lt">0</span></span>
          <span><b>blocked</b><span id="ltms">0 ms</span></span>
          <span><b>worst</b><span id="ltmax">0 ms</span></span>
          <span><b>first icon</b><span id="icon">-</span></span>
          <span><b>icons</b><span id="icons">0</span></span>
          <span><b>frames loaded</b><span id="loaded">0</span></span>
        </div>
        <nav id="links">
          <a href="../">Summary</a>
          <a href="../full-stats.html">Full stats</a>
        </nav>
      </div>
      <div id="track"><div id="box"></div></div>
      <form id="controls">
        <label>frames <input name="frames" type="number" min="0" /></label>
        <label>ads <input name="ads" type="number" min="0" /></label>
        <label>forms <input name="forms" type="number" min="0" /></label>
        <label>nodes <input name="nodes" type="number" min="0" /></label>
        <label>churn ms <input name="churn" type="number" min="0" /></label>
        <button>Reload</button>
      </form>
    </div>
    <main>
      <h2>Embedded sign-in frames</h2>
      <div class="frames" id="frames"></div>
      <h2>Ad, consent and captcha frames</h2>
      <div class="frames" id="ads"></div>
      <h2>Forms (churned)</h2>
      <div class="forms" id="forms"></div>
      <h2>Content</h2>
      <div class="filler" id="filler"></div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const cfg = { frames: 40, ads: 24, forms: 30, nodes: 5000, churn: 500 };
      for (const k of Object.keys(cfg)) if (params.has(k)) cfg[k] = Number(params.get(k));
      const controls = document.getElementById('controls');
      for (const k of Object.keys(cfg)) controls.elements[k].value = cfg[k];
      // The page cannot read the extension version, so it is passed as ?label= (e.g. ?label=7.13.1).
      const label = params.get('label');
      const build = document.getElementById('build');
      if (label) {
        build.textContent = label;
        document.title = `${label} · Autofill Stress Page`;
        controls.addEventListener('submit', () => {
          const keep = document.createElement('input');
          Object.assign(keep, { type: 'hidden', name: 'label', value: label });
          controls.append(keep);
        });
      } else {
        build.hidden = true;
      }

      // Metrics, also read by the Playwright runner through window.__stress.
      const t0 = performance.timeOrigin;
      const stress = (window.__stress = {
        cfg,
        longTasks: 0,
        blockedMs: 0,
        worstMs: 0,
        droppedFrames: 0,
        fps: 0,
        firstIconMs: null,
        icons: new Set(),
        framesLoaded: 0,
      });
      const $ = id => document.getElementById(id);
      const markIcon = key => {
        if (stress.icons.has(key)) return;
        stress.icons.add(key);
        if (stress.firstIconMs === null) {
          stress.firstIconMs = Math.round(performance.now());
          $('icon').textContent = `${stress.firstIconMs} ms`;
        }
        $('icons').textContent = stress.icons.size;
      };

      new PerformanceObserver(list => {
        for (const e of list.getEntries()) {
          stress.longTasks += 1;
          stress.blockedMs += e.duration - 50;
          stress.worstMs = Math.max(stress.worstMs, e.duration);
        }
        $('lt').textContent = stress.longTasks;
        $('ltms').textContent = `${Math.round(stress.blockedMs)} ms`;
        $('ltmax').textContent = `${Math.round(stress.worstMs)} ms`;
      }).observe({ type: 'longtask', buffered: true });

      // The box moves at constant speed per frame; a blocked main thread makes it visibly stall.
      const box = $('box');
      let x = 0,
        dir = 1,
        last = performance.now(),
        frames = 0,
        windowStart = last;
      const tick = now => {
        const width = box.parentElement.clientWidth - 18;
        x += dir * 6;
        if (x > width || x < 0) {
          dir = -dir;
          x = Math.max(0, Math.min(width, x));
        }
        box.style.transform = `translateX(${x}px)`;
        const gap = now - last;
        if (gap > 34) {
          stress.droppedFrames += Math.round(gap / 16.7) - 1;
          box.style.background = 'var(--bad)';
        } else box.style.background = 'var(--ok)';
        last = now;
        frames += 1;
        if (now - windowStart >= 1000) {
          stress.fps = Math.round((frames * 1000) / (now - windowStart));
          $('fps').textContent = stress.fps;
          $('dropped').textContent = stress.droppedFrames;
          frames = 0;
          windowStart = now;
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);

      // Main document: icon detection.
      new MutationObserver(() => {
        document
          .querySelectorAll('nordpass-icon')
          .forEach((el, k) => markIcon(`main:${el.dataset.npUid ?? k}`));
      }).observe(document.documentElement, { childList: true, subtree: true });
      addEventListener('message', e => {
        if (e.data?.type === 'np-icon') markIcon(`frame:${e.data.i}`);
      });

      const onFrameLoad = () => {
        stress.framesLoaded += 1;
        $('loaded').textContent = stress.framesLoaded;
      };

      // Same-origin sign-in frames: content scripts load and classify in every one.
      const framesEl = $('frames');
      for (let i = 0; i < cfg.frames; i++) {
        const f = document.createElement('iframe');
        f.src = `frame.html?i=${i}`;
        f.onload = onFrameLoad;
        framesEl.append(f);
      }

      // Hosts on 7.13's tracking/consent/captcha skip list. Only used locally, where Chrome maps them
      // to 127.0.0.1 with --host-resolver-rules. Hosted, the frames load ad.html from this site, so
      // visitors never send requests to the real ad, consent or captcha domains.
      const adHosts = [
        'ads.criteo.com',
        'cdn.taboola.com',
        'ib.adnxs.com',
        'tag.pubmatic.com',
        'consent.cookiebot.com',
        'app.usercentrics.eu',
        'newassets.hcaptcha.com',
        'www.recaptcha.net',
        'cdn.privacy-mgmt.com',
        'www.googletagmanager.com',
        'aax.amazon-adsystem.com',
        'ads.rubiconproject.com',
      ];
      const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
      const adsEl = $('ads');
      for (let i = 0; i < cfg.ads; i++) {
        const f = document.createElement('iframe');
        f.className = 'ad';
        f.src = isLocal
          ? `http://${adHosts[i % adHosts.length]}:${location.port || 80}${location.pathname.replace(/[^/]*$/, '')}ad.html?i=${i}`
          : `ad.html?i=${i}`;
        f.onload = onFrameLoad;
        adsEl.append(f);
      }

      // Main-document forms of mixed kinds.
      const formKinds = [
        () =>
          '<input type="email" name="email" autocomplete="username" placeholder="Email"><input type="password" name="password" placeholder="Password"><button>Sign in</button>',
        () =>
          '<input name="first" placeholder="First name"><input name="last" placeholder="Last name"><input type="email" name="email" placeholder="Email"><input type="password" name="new-password" autocomplete="new-password" placeholder="New password"><button>Sign up</button>',
        () =>
          '<input name="ccname" placeholder="Name on card"><input name="ccnumber" inputmode="numeric" placeholder="Card number"><input name="ccexp" placeholder="MM/YY"><input name="cvv" placeholder="CVV"><button>Pay</button>',
        () =>
          '<input name="code" inputmode="numeric" maxlength="6" placeholder="Verification code"><button>Verify</button>',
        () =>
          '<input name="address1" placeholder="Street"><input name="city" placeholder="City"><input name="zip" placeholder="Postcode"><select name="country"><option>Lithuania</option><option>Germany</option></select><input type="tel" name="phone" placeholder="Phone"><button>Save</button>',
        () => '<input type="search" name="q" placeholder="Search"><button>Go</button>',
      ];
      const formsEl = $('forms');
      const makeForm = i => {
        const f = document.createElement('form');
        f.action = '#';
        f.onsubmit = () => false;
        f.innerHTML =
          formKinds[(i + Math.floor(Math.random() * formKinds.length)) % formKinds.length]();
        return f;
      };
      for (let i = 0; i < cfg.forms; i++) formsEl.append(makeForm(i));

      // Large DOM for the classifier's page scans.
      const filler = $('filler');
      const chunk = [];
      for (let i = 0; i < cfg.nodes; i++)
        chunk.push(
          `<article><a href="#a${i}">Story ${i}</a> <span>Lorem ipsum dolor sit amet, item ${i}</span></article>`,
        );
      filler.innerHTML = chunk.join('');

      // SPA-style churn: swap one form at a time, which keeps mutation-driven re-detection firing.
      if (cfg.churn > 0 && cfg.forms > 0) {
        let n = 0;
        setInterval(() => {
          const idx = n++ % formsEl.children.length;
          formsEl.children[idx].replaceWith(makeForm(n));
        }, cfg.churn);
      }
    </script>
  </body>
</html>
